<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp for Linux — Settings</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111b21;
    color: #e9edef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 28px;
    font-size: 15px;
  }
  h1 {
    color: #25D366;
    font-size: 22px;
    margin: 0 0 24px 0;
    letter-spacing: -0.5px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid #2a3942;
  }
  label { font-weight: 500; }
  input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #25D366; cursor: pointer;
  }
  .buttons {
    margin-top: 28px; display: flex; gap: 10px;
  }
  button {
    background: #25D366; color: #fff; border: none;
    padding: 10px 20px; font-size: 14px; font-weight: 600;
    border-radius: 6px; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #1ebe57; }
  button.secondary {
    background: transparent; color: #e9edef; border: 1px solid #8696a0;
  }
  button.secondary:hover { background: #2a3942; }
  .note {
    color: #8696a0; font-size: 12px; margin-top: 16px;
  }
</style>
</head>
<body>
<h1>Settings</h1>

<div class="row">
  <label for="closeToTray">Close to tray</label>
  <input type="checkbox" id="closeToTray">
</div>

<div class="row">
  <label for="startWithSystem">Start with system (stored)</label>
  <input type="checkbox" id="startWithSystem">
</div>

<div class="row">
  <label for="startMinimized">Start minimized (stored)</label>
  <input type="checkbox" id="startMinimized">
</div>

<div class="row">
  <label for="notificationsEnabled">Desktop notifications</label>
  <input type="checkbox" id="notificationsEnabled">
</div>

<div class="row">
  <label for="notificationPreview">Notification preview</label>
  <input type="checkbox" id="notificationPreview">
</div>

<div class="buttons">
  <button onclick="save()">Save</button>
  <button class="secondary" onclick="closeWindow()">Close</button>
</div>

<div class="note">Changes take effect immediately. WhatsApp session is not affected.</div>

<script>
  async function load() {
    try {
      const s = await window.whatsappLinuxSettings.getSettings();
      document.getElementById('closeToTray').checked = s.closeToTray !== false;
      document.getElementById('startWithSystem').checked = s.startWithSystem === true;
      document.getElementById('startMinimized').checked = s.startMinimized === true;
      document.getElementById('notificationsEnabled').checked = s.notificationsEnabled !== false;
      document.getElementById('notificationPreview').checked = s.notificationPreview !== false;
    } catch (e) {
      console.error('Failed to load settings:', e);
    }
  }
  async function save() {
    try {
      await window.whatsappLinuxSettings.setSettings({
        closeToTray: document.getElementById('closeToTray').checked,
        startWithSystem: document.getElementById('startWithSystem').checked,
        startMinimized: document.getElementById('startMinimized').checked,
        notificationsEnabled: document.getElementById('notificationsEnabled').checked,
        notificationPreview: document.getElementById('notificationPreview').checked
      });
      closeWindow();
    } catch (e) {
      console.error('Failed to save settings:', e);
    }
  }
  function closeWindow() {
    window.close();
  }
  load();
</script>
</body>
</html>
